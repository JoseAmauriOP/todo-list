{% extends "base.html" %}

{% block title %} Excluir Tarefa {% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[calc(100vh-200px)]">
    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-8 border-t-4 border-red-500">
        <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Excluir Tarefa?</h2>

        <p class="text-gray-600 text-center mb-6">
            Tem certeza que deseja apagar a tarefa <br>
            "<span class="font-bold text-gray-800">{{ task.title }}</span>"?
        </p>

        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative mb-6 text-sm">
            <strong class="font-bold">Atenção!</strong>
            <span class="block sm:inline">Esta ação não pode ser desfeita.</span>
        </div>

        <form method="post" class="flex items-center justify-between space-x-4">
            {% csrf_token %}
            <a href="{% url 'task_list' %}"
                class="w-1/2 text-center bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition duration-200">
                Cancelar
            </a>
            <button type="submit"
                class="w-1/2 text-center bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow transition duration-200 transform hover:-translate-y-0.5">
                Excluir
            </button>
        </form>
    </div>
</div>
{% endblock %}
